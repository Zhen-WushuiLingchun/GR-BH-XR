[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-bh-xr"
version = "0.1.0"
description = "Physics-auditable black-hole XR reference tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "matplotlib",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
gpu = [
  "rendercanvas>=2.6.3",
  "wgpu>=0.31.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
