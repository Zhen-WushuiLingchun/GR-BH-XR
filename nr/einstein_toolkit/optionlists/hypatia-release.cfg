# ET_2026_05 Hypatia CPU release option list for the bounded GR-BH-XR pilot.
# It intentionally disables Cactus/CarpetX debug assertions in the evolution
# hot path. The debug configuration remains useful for parameter bring-up.

VERSION = grbhxr-hypatia-release-2026-08-10-v1

CPP = cpp
CC = gcc
CXX = g++
CUCC = nvcc
FPP = cpp
F90 = gfortran

CPPFLAGS = -DNDEBUG
FPPFLAGS = -traditional -DNDEBUG
CFLAGS = -g -std=gnu99
CXXFLAGS = -g -std=c++17 -D_GNU_SOURCE
CUCCFLAGS = --compiler-bindir g++ -x cu -g -std=c++17 -D_GNU_SOURCE --expt-relaxed-constexpr --extended-lambda --forward-unknown-to-host-compiler --Werror cross-execution-space-call --Werror ext-lambda-captures-this --relocatable-device-code=true --objdir-as-tempdir
F90FLAGS = -g -fcray-pointer -ffixed-line-length-none
LDFLAGS = -rdynamic

DEBUG = no
CPP_DEBUG_FLAGS =
C_DEBUG_FLAGS =
CXX_DEBUG_FLAGS =
CUCC_DEBUG_FLAGS =

OPTIMISE = yes
CPP_OPTIMISE_FLAGS = -DNDEBUG
C_OPTIMISE_FLAGS = -O3
CXX_OPTIMISE_FLAGS = -O3
CUCC_OPTIMISE_FLAGS = -O3
F90_OPTIMISE_FLAGS = -O3

PROFILE = no
CPP_PROFILE_FLAGS =
C_PROFILE_FLAGS = -pg
CXX_PROFILE_FLAGS = -pg
CUCC_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

WARN = yes
CPP_WARN_FLAGS = -Wall
C_WARN_FLAGS = -Wall
CXX_WARN_FLAGS = -Wall
CUCC_WARN_FLAGS = -Wall
F90_WARN_FLAGS = -Wall

OPENMP = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
CUCC_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp
LD_OPENMP_FLAGS = -fopenmp

DISABLE_INT16 = yes
DISABLE_REAL16 = yes
VECTORISE = yes
VECTORISE_ALIGNED_ARRAYS = no
VECTORISE_INLINE = yes
AMREX_ENABLE_CUDA = no
PTHREADS_DIR = NO_BUILD
